# Baseline security headers (ENGINEERING_STANDARD WEB-3). CSP allows self + GA4 + Google Fonts; add each extra origin a page needs, never 'unsafe-inline' for scripts. Roll out as Content-Security-Policy-Report-Only first if unsure.
# include inside a server {} block
server_tokens off;
autoindex off;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
location ~ /\.(git|svn|hg|env|htpasswd|DS_Store) { return 404; }
location ~* \.(bak|old|orig|sql|log|swp|map)$ { return 404; }
