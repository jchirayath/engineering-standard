# Engineering standard gate (§7.1): tokens, generated-code drift, site build scan, TEST-7 map, banned-API lint.
# Installed by engineering-standard/bin/adopt.sh; repo-owned after that (add your stack's tests and scanners).
name: standard
on: [push, pull_request]
permissions: { contents: read }
jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install semgrep==1.180.0
      - run: tools/standard/check.sh
        env: { CI: "true" }
