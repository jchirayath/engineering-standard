name: selftest
on: [push, pull_request]
permissions: { contents: read }
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install semgrep
      - name: Plugin — rules.json current, every rule ID defined once, versions match VERSION
        run: node bin/build-rules.mjs --check
      - name: No secrets anywhere in history (gitleaks, pinned + checksum-verified)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && ./gitleaks git . --no-banner --redact --config .gitleaks.toml
      - name: No owner data committed (local/ stays local)
        run: node bin/check-public.mjs
      - name: No near-duplicate rules (one fact, one owner)
        run: node bin/similar.mjs --check
      - name: Sources gateway — registry pinned, reviewed, rule IDs defined
        run: node bin/sources.mjs --check
      - name: Plugin — MCP server, hooks, parser self-test
        run: node plugin/test/run.mjs --offline
      - name: Lint rules pass their must-fail / must-pass tests
        run: semgrep --test semgrep/
      - name: Token template passes the shared schema + contrast
        run: node design-tokens/scripts/validate.mjs --design design-tokens/template
      - name: Token build generates every platform
        run: node design-tokens/scripts/build.mjs --design design-tokens/template
      - name: Scripts parse
        run: |
          for f in bin/*.sh; do bash -n "$f"; done
          for f in bin/*.mjs site/*.mjs design-tokens/scripts/*.mjs lib/*.mjs mcp/*.mjs hooks/*.mjs plugin/test/*.mjs; do node --check "$f"; done
      - name: Website kit — harden a fixture, then the build gate must pass (and catch drift)
        run: |
          cp -R site/fixtures/demo /tmp/demo
          node site/harden.mjs /tmp/demo --host apache --publish /tmp/demo/public --domain example.com
          node site/check-build.mjs /tmp/demo/public --host apache
          echo '<script>alert(2)</script>' >> /tmp/demo/public/index.html
          if node site/check-build.mjs /tmp/demo/public --host apache; then echo "drift not caught"; exit 1; fi
      - name: TEST-7 checker runs
        run: node bin/check-tests.mjs --config /dev/null || true

